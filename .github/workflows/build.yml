name: ESP32-P4 Faust DSP CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Faust RISC-V Binary
    runs-on: ubuntu-22.04
    container:
      image: espressif/idf:release-v5.3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile ESP32-P4 Faust DSP Engine
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          . /opt/esp/idf/export.sh
          idf.py set-target esp32p4
          idf.py build

      - name: Archive Firmware Binaries
        shell: bash
        run: |
          tar -czf esp32p4-faust-dsp-binaries.tar.gz -C build bootloader/bootloader.bin partition_table/partition-table.bin p4-faust-dsp.bin flasher_args.json

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: p4-faust-dsp-firmware
          path: esp32p4-faust-dsp-binaries.tar.gz

      - name: Attach Binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: esp32p4-faust-dsp-binaries.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
